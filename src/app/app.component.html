<ion-app>
  <ion-menu contentId="main-content">
    <div class="menu-body">
      <ion-menu-toggle [autoHide]="false">
        <a class="title" routerLink="/">Time off</a>
      </ion-menu-toggle>

      <section class="demo">
        <h2 class="demo-heading">Switch account</h2>
        @for (account of demoAccounts(); track account.id) {
          @let isActive = account.id === activeAccount()?.id;
          <ion-menu-toggle [autoHide]="false">
            <ion-item
              button
              (click)="chooseAccount(account)"
              [class.active]="isActive"
              [attr.aria-current]="isActive ? 'true' : null"
            >
              <span
                class="avatar"
                aria-hidden="true"
                [class.supervisor]="account.role === Role.Supervisor"
                [style.--icon]="'url(assets/icons/' + (account.role | lowercase) + '.svg)'"
              >
              </span>
              <ion-label>
                <span class="name">{{ account.name }}</span>
                <span class="role">{{ account.role }}</span>
              </ion-label>
              @if (isActive) {
                <span class="check" slot="end" aria-hidden="true" style="--icon: url(assets/icons/check.svg)"></span>
              }
            </ion-item>
          </ion-menu-toggle>
        }
      </section>
    </div>
  </ion-menu>
  <div class="ion-page" id="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-menu-button></ion-menu-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <div class="page-container">
      <ion-router-outlet></ion-router-outlet>
    </div>
  </div>
</ion-app>
