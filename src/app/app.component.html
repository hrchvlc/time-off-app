<ion-app>
  <ion-menu contentId="main-content">
    <ion-header>
      <ion-toolbar color="primary">
        <ion-title>Menu</ion-title>
      </ion-toolbar>
    </ion-header>
    <div class="ion-padding">
      <section class="demo">
        <ion-menu-toggle [autoHide]="false">
          <ion-item button (click)="returnHome()" class="title">Time off</ion-item>
        </ion-menu-toggle>
      </section>
      <section class="demo">
        <h2 class="demo-heading">Switch account</h2>
          @for (account of demoAccounts(); track account.id) {
            <ion-menu-toggle [autoHide]="false">
              <ion-item button (click)="chooseAccount(account.role)">
               <span class="avatar"
                     role="img"
                     [attr.aria-label]="'Avatar ' + account.role"
                     [class.supervisor]="account.role === Role.Supervisor"
                     [style.--icon]="'url(assets/icons/' + (account.role | lowercase) + '.svg)'">
                </span>
                <ion-label>
                  <span class="name">{{ account.name }}</span>
                  <span class="role">{{ account.role }}</span>
                </ion-label>
              </ion-item>
            </ion-menu-toggle>
          }
      </section>
    </div>
  </ion-menu>
  <div class="ion-page" id="main-content">
    <ion-header>
      <ion-toolbar>
        <ion-buttons slot="start">
          <ion-menu-button></ion-menu-button>
        </ion-buttons>
      </ion-toolbar>
    </ion-header>
    <ion-content class="ion-padding">
      @if (isLoading()) {
        <ion-spinner></ion-spinner>
      }
       <ion-router-outlet></ion-router-outlet>
      </ion-content>
  </div>
</ion-app>
