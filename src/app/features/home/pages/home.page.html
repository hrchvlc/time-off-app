<ion-content>
  <div class="column">
    <div class="mark">
      <span class="week"><span class="bar vacation-ink"></span></span>
      <span class="week"><span class="bar sick-pencil"></span></span>
      <span class="week">
        <span class="bar crossed"></span>
        <span class="bar personal-ink"></span>
      </span>
    </div>

    <h1 class="title">Time off</h1>
    <p class="lead">Request leave, or review your team's.</p>

    <section class="demo">
      <h2 class="demo-heading">Login as</h2>
      @if (isLoading()) {
        <div class="loading">
          <ion-spinner name="crescent"></ion-spinner>
        </div>
      }
      <div class="accounts">
        @for (account of demoAccounts(); track account.id) {
          <button type="button" class="account" (click)="chooseAccount(account)">
            <span class="avatar"
                  role="img"
                  [attr.aria-label]="'Avatar ' + account.role"
                  [class.supervisor]="account.role === Role.Supervisor"
                  [style.--icon]="'url(assets/icons/' + (account.role | lowercase) + '.svg)'"></span>
            <span class="name">{{ account.name }}</span>
            <span class="role">{{ account.role }}</span>
          </button>
        }
      </div>
    </section>
  </div>
</ion-content>
